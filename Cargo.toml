[workspace]
members = ["crates/sandboxd-protocol", "crates/guest-protocol", "crates/firecracker-api", "guest-agent"]
resolver = "2"
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.93"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
ciborium = "0.2.2"
sha2 = "0.10.9"
hex = "0.4.3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "process"] }

[package]
name = "apollo-sandboxd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Standalone, fail-closed Firecracker sandbox control plane"

[dependencies]
sandboxd-protocol = { path = "crates/sandboxd-protocol" }
artifactd-protocol = { path = "../apollo-artifactd/crates/artifactd-protocol" }
firecracker-api = { path = "crates/firecracker-api" }
guest-protocol = { path = "crates/guest-protocol" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
tokio.workspace = true
toml = "0.8.23"
clap = { version = "4.5.51", features = ["derive"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
rustix = { version = "1.1.4", features = ["fs", "net", "process", "system", "event", "mount", "termios", "thread"] }
getrandom = "0.2.16"
zeroize = "1.8.2"
chacha20poly1305 = "0.10.1"
nix = { version = "0.31.3", features = ["socket", "uio", "term"] }

tempfile = "3.23.0"

[dev-dependencies]
proptest = "1.9.0"
tar = "0.4.44"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
panic = "deny"

[[bin]]
name = "apollo-sandboxd"
path = "src/main.rs"

[[bin]]
name = "apollo-sandboxctl"
path = "src/bin/apollo-sandboxctl.rs"
